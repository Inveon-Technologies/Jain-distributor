# Local / single-server stack: PostgreSQL + API + web.
#   cp .env.example .env   # adjust secrets
#   docker compose up -d --build
#   docker compose exec api node dist/db/seed.js   # optional demo data
name: jain-distributor

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jain_distributor}
      POSTGRES_USER: ${POSTGRES_USER:-jain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jain}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    image: ${API_IMAGE:-jain-distributor-api:local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-jain}:${POSTGRES_PASSWORD:-jain}@db:5432/${POSTGRES_DB:-jain_distributor}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -hex 32)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@jain.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ADMIN_NAME: ${ADMIN_NAME:-प्रशासक}
      STT_PROVIDER: ${STT_PROVIDER:-mock}
      STT_LANGUAGE: ${STT_LANGUAGE:-mr-IN}
      GOOGLE_SPEECH_API_KEY: ${GOOGLE_SPEECH_API_KEY:-}
      STT_MODEL: ${STT_MODEL:-latest_long}
      STT_PHRASE_BOOST: ${STT_PHRASE_BOOST:-12}
      STT_EXTRA_PHRASES: ${STT_EXTRA_PHRASES:-}
      STT_ALTERNATIVE_LANGUAGES: ${STT_ALTERNATIVE_LANGUAGES:-}
      STT_MIN_CONFIDENCE: ${STT_MIN_CONFIDENCE:-0.7}
      MAX_AUDIO_MB: ${MAX_AUDIO_MB:-10}
    ports:
      - "${API_PORT:-4000}:4000"

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
    image: ${WEB_IMAGE:-jain-distributor-web:local}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
